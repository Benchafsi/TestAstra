name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        # npm regenerates platform-specific optional entries used by Tailwind's
        # native package. A Windows-generated lockfile cannot satisfy npm ci on Linux.
        run: npm install --ignore-scripts
      - name: Build static site
        run: npm run build:pages
      - name: Normalize project-site assets
        run: |
          test -f dist/client/index.html
          test -d dist/client/TestAstra/_next
          mkdir -p dist/client/_next
          cp -R dist/client/TestAstra/_next/. dist/client/_next/
          touch dist/client/.nojekyll
          test -f dist/client/_next/static/css/*.css
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
